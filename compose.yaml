
services:
  redis:
    image: redis:8-alpine
    network_mode: host
    restart: always
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6380"
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    image: ghcr.io/beyondyang117/xboard:node-probe-prod-test
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/www/.env
      - ./storage/theme:/www/storage/theme
    environment:
      - docker=true
    network_mode: host
    command: php artisan octane:start --port=7003 --host=0.0.0.0
    restart: always
  horizon:
    image: ghcr.io/beyondyang117/xboard:node-probe-prod-test
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/www/.env
    restart: always
    network_mode: host
    command: php artisan horizon
  ws-server:
    image: ghcr.io/beyondyang117/xboard:node-probe-prod-test
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/www/.env
    restart: always
    network_mode: host
    command: php artisan ws-server start

volumes:
  redis-data:
